name: fetch-xg
# One-off / manual job: download the full Understat xG history and commit it.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: data/cache/soccerdata
          key: soccerdata-${{ github.run_id }}
          restore-keys: soccerdata-
      - run: pip install pandas pyarrow soccerdata
      - run: python -m src.fmp.xg_download
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/xg/
          git commit -m "Download Understat xG history" || echo "No changes"
          git push
